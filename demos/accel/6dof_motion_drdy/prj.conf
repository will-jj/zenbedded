CONFIG_SENSOR=y
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=n

# Floating point format support
# Selecting this increases stack size requirements slightly, but increases code size significantly.
CONFIG_CBPRINTF_FP_SUPPORT=y

# nrf52dk/nrf52832 specific
CONFIG_USE_SEGGER_RTT=n

# Trigger mode: sample is using interrupt triggering
CONFIG_ICM4268X_TRIGGER_OWN_THREAD=y



CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_POSIX_API=y

CONFIG_ZENBEDDED_TIER_2=y
CONFIG_ZENBEDDED_TIER2_SCHEMA_PATH="interface_schema.yaml"

CONFIG_ZENBEDDED_RCL=y
CONFIG_ZENBEDDED_QOS_RELIABLE=y

CONFIG_ZENBEDDED_RCL_PUB_TOPIC="zenbedded/imu/state"
CONFIG_ZENBEDDED_RCL_SUB_TOPIC="zenbedded/imu/cmd"

CONFIG_ZENBEDDED_ZENOH_LOCATOR="127.0.0.1:7447"
CONFIG_ZENBEDDED_NODE_NAME="imu_tier2"

CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_ZENBEDDED_USBD_PRODUCT="IMU Tier2"
